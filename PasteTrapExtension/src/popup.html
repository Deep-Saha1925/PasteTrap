<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PasteTrap</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>🛡 PasteTrap</h1>
  <p>Think before you copy, paste, or execute random content.</p>

  <button id="scanButton">Scan Current Page</button>
  <div id="status" class="status">Scanning…</div>

  <label class="toggle">
    <input type="checkbox" id="warnToggle" checked>
    Show warning banner on risky pages
  </label>

  <script src="popup.js"></script>
</body>
</html>
