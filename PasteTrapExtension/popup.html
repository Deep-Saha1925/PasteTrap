<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PasteTrap</title>

    <style>
        body {
            width: 300px;
            margin: 0;
            padding: 20px;

            font-family: Arial, sans-serif;

            background: #0b1020;
            color: white;
        }

        h1 {
            margin-top: 0;
            font-size: 24px;
        }

        p {
            color: #aab6c8;
            line-height: 1.5;
        }

        button {
            width: 100%;

            margin-top: 15px;

            padding: 12px;

            border: none;
            border-radius: 8px;

            background: #2563eb;
            color: white;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .status {
            margin-top: 20px;

            padding: 12px;

            border-radius: 8px;

            background: #162033;

            line-height: 1.4;
        }

    </style>
</head>

<body>
    <h1>PasteTrap</h1>

    <p>
        Think before you copy, paste,
        or execute random content.
    </p>

    <button id="scanButton">
        Scan Current Page
    </button>

    <div
        id="status"
        class="status"
    >
        Waiting for scan...
    </div>

    <script src="popup.js"></script>
</body>

</html>
